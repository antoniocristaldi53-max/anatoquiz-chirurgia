<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Schema originale semplificato del triangolo epatocistico (vista anteriore, fegato retratto). Non in scala. -->
  <rect width="400" height="400" fill="#fbf8f4"/>
  <path d="M0,0 H400 V92 C330,118 262,104 200,116 C140,128 70,108 0,124 Z" fill="#c98b7a"/>
  <path d="M0,0 H400 V92 C330,118 262,104 200,116 C140,128 70,108 0,124" fill="none" stroke="#9a5f50" stroke-width="2"/>
  <!-- vena porta (posteriore) -->
  <path d="M262,400 C262,320 262,230 258,150" stroke="#6f8fc8" stroke-width="24" fill="none" opacity="0.55" stroke-linecap="round"/>
  <!-- arterie -->
  <g stroke="#c0392b" fill="none" stroke-linecap="round">
    <path d="M304,400 V180" stroke-width="8"/>
    <path d="M304,180 C310,150 318,125 322,100" stroke-width="6"/>
    <path d="M304,180 C295,145 262,138 230,140 C205,141 186,130 175,112" stroke-width="6"/>
    <path d="M205,138 C190,160 178,185 160,225" stroke-width="4"/>
  </g>
  <!-- colecisti -->
  <path d="M150,232 C175,245 168,275 140,285 C110,330 90,385 55,378 C20,372 25,330 50,300 C80,265 115,225 150,232 Z" fill="#8cbf73" stroke="#5d8f47" stroke-width="2"/>
  <!-- vie biliari -->
  <g stroke="#3f8a3a" fill="none" stroke-linecap="round">
    <path d="M196,118 C208,132 220,142 230,150" stroke-width="9"/>
    <path d="M268,110 C256,128 242,142 230,150" stroke-width="9"/>
    <path d="M230,150 V400" stroke-width="12"/>
    <path d="M156,242 C185,250 205,262 230,264" stroke-width="8"/>
  </g>
  <!-- linfonodo cistico -->
  <circle cx="152" cy="204" r="9" fill="#e8c07d" stroke="#b48a45" stroke-width="2"/>
  <text x="392" y="392" font-family="sans-serif" font-size="11" fill="#8a7f75" text-anchor="end">Schema originale · non in scala</text>
</svg>
