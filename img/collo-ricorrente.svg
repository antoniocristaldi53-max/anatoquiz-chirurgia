<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Schema originale semplificato: lobo tiroideo destro retratto medialmente, vista chirurgica laterale. Non in scala. -->
  <rect width="400" height="400" fill="#fbf8f4"/>
  <rect x="300" y="0" width="100" height="400" fill="#e4dccf"/>
  <g stroke="#cdbfa9" stroke-width="3">
    <line x1="300" y1="40" x2="400" y2="40"/><line x1="300" y1="80" x2="400" y2="80"/><line x1="300" y1="120" x2="400" y2="120"/>
    <line x1="300" y1="160" x2="400" y2="160"/><line x1="300" y1="200" x2="400" y2="200"/><line x1="300" y1="240" x2="400" y2="240"/>
    <line x1="300" y1="280" x2="400" y2="280"/><line x1="300" y1="320" x2="400" y2="320"/><line x1="300" y1="360" x2="400" y2="360"/>
  </g>
  <!-- vena giugulare interna e carotide comune -->
  <rect x="30" y="0" width="38" height="400" rx="16" fill="#7d97cc" opacity="0.8"/>
  <rect x="76" y="0" width="28" height="400" rx="12" fill="#cf5b4e"/>
  <!-- arteria tiroidea superiore -->
  <path d="M104,38 C170,50 240,80 292,108" stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- ramo esterno del laringeo superiore -->
  <path d="M150,20 C200,40 250,62 318,86" stroke="#e6c229" stroke-width="3.5" fill="none" stroke-dasharray="0" stroke-linecap="round"/>
  <!-- lobo tiroideo -->
  <ellipse cx="300" cy="215" rx="58" ry="115" fill="#c4646c" stroke="#94434b" stroke-width="2"/>
  <!-- arteria tiroidea inferiore -->
  <path d="M104,250 C160,262 200,246 250,240" stroke="#c0392b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- nervo laringeo ricorrente -->
  <path d="M180,400 C190,330 205,250 218,190 C228,140 240,110 252,88" stroke="#e6c229" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- paratiroidi -->
  <ellipse cx="225" cy="175" rx="11" ry="8" fill="#d79a3b" stroke="#9c6a1f" stroke-width="2"/>
  <ellipse cx="236" cy="318" rx="11" ry="8" fill="#d79a3b" stroke="#9c6a1f" stroke-width="2"/>
  <text x="392" y="392" font-family="sans-serif" font-size="11" fill="#8a7f75" text-anchor="end">Schema originale · non in scala</text>
</svg>
